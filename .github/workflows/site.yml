# Publica o site da GALO no GitHub Pages a cada push no main.
#
# O site é estático: as páginas são geradas por site/gerar_estatico.galo (via site/publicar.sh)
# e o compilador da GALO roda no navegador de quem visita (Pyodide). Nada roda num servidor.
# Antes de publicar, os testes do site (escritos em GALO) precisam passar.
name: Site no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Testes do site (em GALO)
        run: python -m galo executar site/testes.galo

      - id: pages
        uses: actions/configure-pages@v6

      - name: Gerar o site estático
        run: sh site/publicar.sh
        env:
          BASE: ${{ steps.pages.outputs.base_path }}
          PYTHON: python

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - id: publicacao
        uses: actions/deploy-pages@v5
